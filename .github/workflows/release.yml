name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - platform: x64
            msbuild_platform: x64
            output_dir: x64\Release
            artifact_name: bcrypt_x64.dll
          - platform: x86
            msbuild_platform: Win32
            output_dir: Release
            artifact_name: bcrypt_x86.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.platform }} Release
        run: >
          msbuild bcrypt.sln
          /p:Configuration=Release
          /p:Platform=${{ matrix.msbuild_platform }}
          /m
          /nologo
          /verbosity:minimal

      - name: Rename output DLL
        shell: pwsh
        run: |
          Copy-Item "bcrypt\${{ matrix.output_dir }}\bcrypt.dll" "${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## bcrypt proxy DLL — ${{ github.ref_name }}

            ### Downloads
            | File | Architecture |
            |------|-------------|
            | `bcrypt_x64.dll` | 64-bit (x64) |
            | `bcrypt_x86.dll` | 32-bit (x86) |

            Drop the appropriate DLL next to the target application, renamed to `bcrypt.dll`.
          files: artifacts/*
          fail_on_unmatched_files: true
